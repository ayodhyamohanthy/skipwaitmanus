<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" fill="none">
  <line x1="24" y1="340" x2="536" y2="340" stroke="#0A0A0A" stroke-width="3"/>
  <defs><linearGradient id="gB" x1="0" y1="140" x2="0" y2="340" gradientUnits="userSpaceOnUse">
    <stop stop-color="#fce9da"/><stop offset="0.5" stop-color="#f6cfdd"/><stop offset="1" stop-color="#e7d6f4"/></linearGradient>
  <clipPath id="doorInt"><rect x="296" y="150" width="68" height="190"/></clipPath></defs>
  <!-- closed doors -->
  <g stroke="#0A0A0A" stroke-width="4.5" fill="#FFFFFF">
    <rect x="56" y="140" width="88" height="200" rx="9"/>
    <rect x="416" y="140" width="88" height="200" rx="9"/>
  </g>
  <rect x="176" y="140" width="88" height="200" rx="9" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="4.5"/>
