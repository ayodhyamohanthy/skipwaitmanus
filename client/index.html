    <script>
      // Dark theme follows the system preference unless the user has chosen
      // explicitly. `.dark` on <html> is the single switch the stylesheet reads,
      // so CSS and JS cannot drift apart. Runs before first paint to avoid a flash.
      (function () {
        try {
          var stored = localStorage.getItem("skipwait-theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (stored === "dark" || (!stored && prefersDark)) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>

    <script>
      // Analytics loads only when both values were provided at build time;
      // an unset placeholder previously produced a broken request on every page.
      (function () {
        try {
          var endpoint = "%VITE_ANALYTICS_ENDPOINT%";
          var websiteId = "%VITE_ANALYTICS_WEBSITE_ID%";
          if (!endpoint || endpoint.indexOf("%") === 0 || !websiteId || websiteId.indexOf("%") === 0) return;
          var s = document.createElement("script");
          s.defer = true;
          s.src = endpoint + "/umami";
          s.setAttribute("data-website-id", websiteId);
          document.head.appendChild(s);
        } catch (e) {}
