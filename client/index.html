  <body>
    <style>html.sw-boot #root{visibility:hidden}</style>
    <script>
      // Keep the app invisible until the brand font is ready, so users never see text in a fallback font
      // or half-built pieces. A hard timer guarantees the page is never left hidden.
      document.documentElement.classList.add("sw-boot");
      window.__swReveal = function () { document.documentElement.classList.remove("sw-boot"); };
      // If the app bundle never even parses (blocked or failed script), reveal the static
      // snapshot after 2.5s so the page still has content. If the bundle IS alive but simply
      // slow, revealing then would paint the old static snapshot before React commits - the
      // 12s absolute timer is the last-resort failsafe for a bundle that loaded but never mounted.
      setTimeout(function () { if (!window.__swBootAlive) window.__swReveal(); }, 2500);
      setTimeout(window.__swReveal, 12000);
      // Start the referrer home data request now, in parallel with the app and sign-in loading (the session cookie
      // authenticates it). The page uses it once if it is fresh, and otherwise asks again. Only started when this browser loaded the bundle before (hint set by the app), so signed-out visitors do not log a 401.
      try {
        if (location.pathname === "/referrer-home" && localStorage.getItem("sw-home-prefetch-ok") === "1") {
          window.__swHomeBundle = { at: Date.now(), response: fetch("/api/referrer/home-bundle", { credentials: "include" }) };
        }
      } catch (e) {}
    </script>
    <noscript><style>html.sw-boot #root{visibility:visible}</style></noscript>

    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Analytics loads only when both values were provided at build time;
      // an unset placeholder previously produced a broken request on every page.
      (function () {
        try {
          var endpoint = "%VITE_ANALYTICS_ENDPOINT%";
          var websiteId = "%VITE_ANALYTICS_WEBSITE_ID%";
          if (!endpoint || endpoint.indexOf("%") === 0 || !websiteId || websiteId.indexOf("%") === 0) return;
          var s = document.createElement("script");
          s.defer = true;
          s.src = endpoint + "/umami";
          s.setAttribute("data-website-id", websiteId);
          document.head.appendChild(s);
        } catch (e) {}
      })();
    </script>
