name: Rollback (manual)

# P1-deploy-green-gate (#748, scope amendment #751): deliberate recovery of the API to
# an older known-green commit. Dispatch it from main only. It runs the same release gate
# as Deploy API, from this workflow's own (trusted) commit, before the older target is
# ever checked out; the gate's recovery mode drops only the "production already runs a
# newer commit" refusal, because moving back is the point. The target must:
#   - be a full 40-character SHA on main, typed twice, with a reason (recorded with the
#     actor in the run summary);
#   - have its own main CI run (push or dispatch) green in its newest attempt, with
#     typecheck, unit + component + route tests and production build all successful;
#   - have the same schema contract as main (drizzle/deploy, drizzle/schema.ts,
#     server/schemaReconcile.ts byte for byte), since only then is the older code known
#     to fit the live database. No migration and no database change runs here.
# It waits in the deploy-api queue, deploys and verifies the target SHA with the same
# scripts as Deploy API, then moves refs/tags/api-runtime to it.
#
# REL-rollback-skew (D-212) adds the web leg. The same request recovers the Web (web) or
# both systems (all) to an older green commit; each leg keeps its own trusted gate: the API
# leg runs require-green-release.mjs --target api --recovery (unchanged, and the release
# path used by the deploy workflows is byte-identical), the web leg runs this row's
# scripts/rollbackTarget.mjs web-gate, which reuses the same CI verdict by import. The web
# leg builds the target ref and deploys it with the same wrangler pages deploy command
# Deploy Web uses, under a job-level deploy-pages concurrency group so it never runs beside
# a web deploy, then verifies from Cloudflare and the live page that the target is what the
# world now gets. For `all` the web leg finishes first: a newer web must never face an API
# that has already gone back (the skew this row exists to prevent).
#
# Any refusal changes nothing in production; fix the input or the target's CI and dispatch
# again.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'System to recover (api, web or all)'
        type: choice
        options:
          - api
          - all
          - web
        default: api
        required: true
      commit:
        description: 'Full 40-character SHA of the known-green main commit to run again'
        type: string
        required: true
      confirm:
        description: 'The same SHA again, to confirm'
        type: string
        required: true
      reason:
        description: 'Why production must run this commit (recorded in the run summary)'
        type: string
        required: true

concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  # Moves refs/tags/api-runtime after a verified recovery, as Deploy API does.
  contents: write
  # The release gate reads the CI runs of the target.
  actions: read

jobs:
  recovery-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      # This workflow's own commit on main, never the recovery target.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require a deliberate request and green CI on the recovery target
        if: inputs.target != 'web'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The system this leg recovers, never the dispatch's: the API gate is API-only and
          # refuses target "all" as "only the API has a recovery job".
          RECOVERY_SYSTEM: api
          RECOVERY_COMMIT: ${{ inputs.commit }}
          RECOVERY_CONFIRM: ${{ inputs.confirm }}
          RECOVERY_REASON: ${{ inputs.reason }}
        run: node scripts/require-green-release.mjs --target api --recovery
      # The web leg keeps its own gate (D-248): require-green-release.mjs stays API-only, and
      # scripts/rollbackTarget.mjs web-gate reuses its ciVerdict/releaseRuns by import, so a
      # target: all dispatch reaches each leg's gate as that leg's own system.
      - name: Require a deliberate request and green CI on the web recovery target
        if: inputs.target != 'api'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECOVERY_SYSTEM: ${{ inputs.target }}
          RECOVERY_COMMIT: ${{ inputs.commit }}
          RECOVERY_CONFIRM: ${{ inputs.confirm }}
          RECOVERY_REASON: ${{ inputs.reason }}
        run: node scripts/rollbackTarget.mjs web-gate

  recover-api:
    # For target: all the web recovers first: a newer web must never face an API that has
    # already gone back. A skipped web leg (target: api) leaves the API recovery unchanged.
    needs: [recovery-gate, rollback-web]
    if: ${{ !cancelled() && needs.recovery-gate.result == 'success' && inputs.target != 'web' && (inputs.target == 'api' || needs.rollback-web.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      # Control scripts run from the trusted checkout; the target only supplies the artifact.
      - name: Check out the trusted workflow code
        uses: actions/checkout@v4
        with:
          path: trusted
          persist-credentials: false
      # No stored credentials: the target's install and build scripts never see the token.
      - name: Check out the recovery target
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          path: target
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: target/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: target/pnpm-lock.yaml
      - name: Check the target can report its release identity
        working-directory: target
        run: |
          grep -q '"API_RELEASE"' wrangler.jsonc || { echo "::error::The target's wrangler.jsonc has no API_RELEASE, so its release could not be verified; recovery refused"; exit 1; }
          grep -q 'COPY commit-sha.txt' Dockerfile || { echo "::error::The target's image does not carry commit-sha.txt, so its release could not be verified; recovery refused"; exit 1; }
      - name: Record the target commit SHA
        working-directory: target
        env:
          EXPECTED_SHA: ${{ inputs.commit }}
        run: printf '%s\n' "$EXPECTED_SHA" > commit-sha.txt
      - name: Install the target's dependencies
        working-directory: target
        run: pnpm install --frozen-lockfile
      - name: Build the target
        working-directory: target
        run: pnpm build
      # Last look before the first production write: a CI re-run of the target may have
      # turned red, or this job alone may be a re-run.
      - name: Re-check the recovery target
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This leg recovers the API even when the dispatch asked for all (see recovery-gate).
          RECOVERY_SYSTEM: api
          RECOVERY_COMMIT: ${{ inputs.commit }}
          RECOVERY_CONFIRM: ${{ inputs.confirm }}
          RECOVERY_REASON: ${{ inputs.reason }}
        run: node trusted/scripts/require-green-release.mjs --target api --recovery --once
      - name: Stamp the target's release identity
        working-directory: target
        env:
          EXPECTED_SHA: ${{ inputs.commit }}
        run: |
          node -e 'const fs=require("fs");const p="wrangler.jsonc";let s=fs.readFileSync(p,"utf8");s=s.replace(/"API_RELEASE":\s*"[^"]+"/, `"API_RELEASE": "${process.env.EXPECTED_SHA}"`);fs.writeFileSync(p,s)'
      - name: Deploy the target (container image + worker)
        working-directory: target
        env:
          EXPECTED_SHA: ${{ inputs.commit }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash ../trusted/scripts/deploy-cloudflare-two-phase.sh
      - name: Verify the active release is the target
        working-directory: target
        env:
          EXPECTED_SHA: ${{ inputs.commit }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash ../trusted/scripts/verify-cloudflare-container-release.sh
      # The same lightweight tag Deploy API moves, set through the API so only this step holds the token.
      - name: Move the runtime marker to the target
        env:
          EXPECTED_SHA: ${{ inputs.commit }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/api-runtime" -f sha="$EXPECTED_SHA" -F force=true
      - name: Record the recovery result
        if: always()
        env:
          RESULT: ${{ job.status }}
          EXPECTED_SHA: ${{ inputs.commit }}
        run: |
          printf '### Recovery %s: target %s, workflow commit %s\n' "$RESULT" "$EXPECTED_SHA" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  rollback-web:
    needs: recovery-gate
    if: ${{ !cancelled() && needs.recovery-gate.result == 'success' && inputs.target != 'api' }}
    runs-on: ubuntu-latest
    # Job level, so rollback.yml's workflow-level deploy-api pin stays true and this leg
    # never runs beside a Deploy Web run (both write the production Pages deployment).
    concurrency:
      group: deploy-pages
      cancel-in-progress: false
    steps:
      # Control scripts run from the trusted checkout; the target only supplies the artifact.
      - name: Check out the trusted workflow code
        uses: actions/checkout@v4
        with:
          path: trusted
          persist-credentials: false
      - name: Check out the recovery target
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          path: target
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: target/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: target/pnpm-lock.yaml
      - name: Install the target's dependencies
        working-directory: target
        run: pnpm install --frozen-lockfile
      # The same build Deploy Web runs, stamped with the target SHA so the live page proves it.
      - name: Build the target web
        working-directory: target
        env:
          VITE_WORKOS_CLIENT_ID: client_01M17TTFJ6784B1CN6MHAHB60Y
          VITE_WORKOS_ENABLED: "true"
          VITE_GIT_COMMIT_SHA: ${{ inputs.commit }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_CLARITY_PROJECT_ID: ${{ secrets.VITE_CLARITY_PROJECT_ID }}
        run: pnpm build
      # Last look before the production write: a CI re-run of the target may have turned
      # red, or this job alone may be a re-run.
      - name: Re-check the web recovery target
        working-directory: trusted
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECOVERY_SYSTEM: ${{ inputs.target }}
          RECOVERY_COMMIT: ${{ inputs.commit }}
          RECOVERY_CONFIRM: ${{ inputs.confirm }}
          RECOVERY_REASON: ${{ inputs.reason }}
        run: node scripts/rollbackTarget.mjs web-gate
      # The same command Deploy Web uses, so the recovered build becomes the production
      # deployment of the same project.
      - name: Deploy the target web to Cloudflare Pages
        working-directory: target
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist/public --project-name skipwait --branch main --commit-dirty=true
      # REL-release-verify never sees a recovery (it triggers on the deploy workflows), so
      # this leg proves itself: Cloudflare's canonical deployment and the live page both
      # carry the target, or the job fails loudly.
      - name: Verify the live web is the target
        working-directory: trusted
        env:
          EXPECTED_SHA: ${{ inputs.commit }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/rollbackTarget.mjs verify-web
      - name: Record the recovery result
        if: always()
        env:
          RESULT: ${{ job.status }}
          EXPECTED_SHA: ${{ inputs.commit }}
        run: |
          printf '### Web recovery %s: target %s, workflow commit %s\n' "$RESULT" "$EXPECTED_SHA" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
