name: Rollback (manual)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which system to rollback (api / web / all)'
        required: true
        default: 'all'
      commit:
        description: 'Commit SHA to rollback to (e.g. 734b45b; blank = previous deploy)'
        required: false
        default: ''

jobs:
  rollback-api:
    if: inputs.target == 'api' || inputs.target == 'all'
    runs-on: [self-hosted, skipwait-mac]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Deploy previous build
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Append sync log
        if: always()
        run: bash scripts/append-sync-log.sh "rollback-api" "${{ inputs.commit || 'prev' }}" "${{ job.status }}"
