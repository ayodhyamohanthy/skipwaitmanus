name: DB connect probe (temporary)
on:
  push:
    branches: [ci/migrate-before-deploy]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Connect over TLS
        env:
          MYSQL_PWD: ${{ secrets.SKIPWAIT_DB_PASSWORD }}
        run: mysql --host="${{ vars.SKIPWAIT_DB_HOST }}" --port="${{ vars.SKIPWAIT_DB_PORT }}" --user="${{ vars.SKIPWAIT_DB_USER }}" --ssl-mode=REQUIRED --connect-timeout=15 --batch "${{ vars.SKIPWAIT_DB_NAME }}" -e "SELECT 'connected' AS probe, VERSION() AS v"
