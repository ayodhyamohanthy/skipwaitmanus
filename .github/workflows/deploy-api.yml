name: Deploy API (Cloudflare Containers)

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "shared/**"
      - "drizzle/**"
      - "src/worker.ts"
      - "Dockerfile"
      - ".dockerignore"
      - "wrangler.jsonc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "patches/**"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/deploy-api.yml"
      - "scripts/classify-api-changes.sh"
      - "scripts/verify-cloudflare-container-release.sh"
      - "scripts/assert-api-workflow-selection.sh"
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

# ──────────────────────────────────────────────
# EXTENSION POINT: add a new step here for each
# additional target system (Vercel, Netlify, …).
# See scripts/sync-manifest.json for the schema.
# ──────────────────────────────────────────────

permissions:
  contents: write
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify pushed changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          last=$(git rev-parse --verify refs/tags/api-runtime^{commit} 2>/dev/null || true)
          result=$(LAST_DEPLOYED_SHA="$last" bash scripts/classify-api-changes.sh)
          echo "$result" >> "$GITHUB_OUTPUT"
          echo "$result"

      - uses: pnpm/action-setup@v4
        if: steps.changes.outputs.classification != 'skip'

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.classification != 'skip'
        with:
          node-version: 22
          cache: pnpm

      - name: Record commit SHA
        if: steps.changes.outputs.classification == 'runtime'
        run: echo "${{ github.sha }}" > commit-sha.txt

      - name: Install dependencies
        if: steps.changes.outputs.classification != 'skip'
        run: pnpm install --frozen-lockfile

      - name: Assert API workflow selection
        if: steps.changes.outputs.classification != 'skip'
        run: bash scripts/assert-api-workflow-selection.sh

      - name: Typecheck
        if: steps.changes.outputs.classification == 'runtime'
        run: npx tsc --noEmit

      - name: Build bundle
        if: steps.changes.outputs.classification == 'runtime'
        run: pnpm build

      - name: Ensure admin smoke signing secret exists
        if: steps.changes.outputs.classification == 'runtime'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +x
          if ! npx wrangler secret list --json | jq -e '.[] | select(.name == "ADMIN_SMOKE_SECRET")' >/dev/null; then
            openssl rand -base64 32 | npx wrangler secret put ADMIN_SMOKE_SECRET >/dev/null
          fi

      - name: Assert smoke secret hygiene
        if: steps.changes.outputs.classification == 'runtime'
        run: bash scripts/assert-smoke-secret-hygiene.sh

      - name: Capture current Cloudflare application version
        if: steps.changes.outputs.classification == 'runtime'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          app_id=$(npx wrangler containers list --json | jq -r '.[] | select(.name=="skipwaitmanus-api") | .id' | head -1)
          info=$(npx wrangler containers info "$app_id" --json)
          echo "BEFORE_VERSION=$(jq -r '.current_version // .version // empty' <<<"$info")" >> "$GITHUB_ENV"
          echo "BEFORE_IMAGE=$(jq -r '.configuration.image // .image // empty' <<<"$info")" >> "$GITHUB_ENV"

      - name: Stamp release identity into Cloudflare configuration
        if: steps.changes.outputs.classification == 'runtime'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          node -e 'const fs=require("fs");const p="wrangler.jsonc";let s=fs.readFileSync(p,"utf8");s=s.replace(/"API_RELEASE":\s*"[^"]+"/, `"API_RELEASE": "${process.env.EXPECTED_SHA}"`);fs.writeFileSync(p,s)'

      - name: Deploy container image + worker
        if: steps.changes.outputs.classification == 'runtime'
        run: bash scripts/deploy-cloudflare-two-phase.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify active Cloudflare container release
        if: ${{ false }}
        env:
          EXPECTED_SHA: ${{ github.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/verify-cloudflare-container-release.sh
      - name: Validate deploy pipeline fixtures
        if: steps.changes.outputs.classification == 'pipeline'
        run: pnpm vitest run client/src/pipeline/apiChangeClassification.test.ts server/cloudflareContainerRelease.test.ts

      - name: Report pipeline-only validation
        if: steps.changes.outputs.classification == 'pipeline'
        run: echo "PIPELINE VALIDATED; runtime unchanged at $(git rev-parse --verify refs/tags/api-runtime^{commit} 2>/dev/null || echo unknown)"

      - name: Update deployed runtime marker
        if: steps.changes.outputs.classification == 'runtime'
        run: |
          git tag -f api-runtime "${{ github.sha }}"
          git push -f origin refs/tags/api-runtime

      - name: Append sync log
        if: always() && steps.changes.outputs.classification != 'skip'
        run: bash scripts/append-sync-log.sh "${{ github.workflow }}" "${{ github.sha }}" "${{ job.status }}"

      - name: Commit sync log back to main
        if: always() && steps.changes.outputs.classification != 'skip'
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@skipwait.me"
          git add docs/SYNC_LOG.md
          if git diff --cached --quiet; then
            echo "no sync log change to commit"
            exit 0
          fi
          git commit -m "Sync log: ${{ github.workflow }} ${{ github.sha }} ${{ job.status }} [skip ci]"
          # The API and Pages workflows push the log concurrently; rebase-retry
          # so a simultaneous push cannot fail the job (non-fatal if it still fails).
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main 2>/dev/null; then echo "sync log pushed"; exit 0; fi
            echo "push attempt $attempt collided — rebasing and retrying"
            git fetch origin main --quiet
            git rebase origin/main --autostash 2>/dev/null || git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "sync log push failed after retries (non-fatal)"; exit 0

      - name: Notify sync status
        if: always() && steps.changes.outputs.classification != 'skip'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const status = `${{ job.status }}`;
            const msg = status === 'success' ? '✅ Sync succeeded' : '❌ Sync failed';
            // Notification must never fail the job: wrap in try/catch so a
            // missing issue or missing permissions only logs a warning.
            try {
              const issues = await github.rest.issues.listForRepo({
                owner: context.repo.owner, repo: context.repo.repo, state: 'all', per_page: 1
              });
              if (issues.data.length > 0) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issues.data[0].number,
                  body: `${msg} — workflow: ${{ github.workflow }}, commit: ${{ github.sha }}`
                });
                console.log('Notification posted to issue #' + issues.data[0].number);
              } else {
                console.log('No issue found to notify — skipping (non-fatal).');
              }
            } catch (err) {
              console.log('Notification skipped (non-fatal): ' + err.message);
            }
