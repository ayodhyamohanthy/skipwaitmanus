name: Deploy API (Cloudflare Containers)

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "shared/**"
      - "drizzle/**"
      - "src/worker.ts"
      - "Dockerfile"
      - "wrangler.jsonc"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

# ──────────────────────────────────────────────
# EXTENSION POINT: add a new step here for each
# additional target system (Vercel, Netlify, …).
# See scripts/sync-manifest.json for the schema.
# ──────────────────────────────────────────────

permissions:
  contents: write
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Record commit SHA
        run: echo "${{ github.sha }}" > commit-sha.txt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build bundle
        run: pnpm build

      - name: Deploy container image + worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify live API serves the pushed commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          # Container instances sleep after 10m idle (sleepAfter) and are
          # recreated on the NEXT request with the newest image.  A warm
          # instance keeps serving the OLD code, and polling keeps it warm —
          # so we must SLEEP FIRST (let it idle out), then wake it once.
          # Lifecycle: the warm instance serves the OLD image; it recycles
          # only after 10m idle (sleepAfter). CRITICAL: every curl request
          # RESETS the idle timer, so we must never wake it while waiting.
          # - wrong SHA  -> the curl woke the OLD instance -> sleep a FULL
          #   10m cycle before the next check.
          # - empty body -> the instance is mid-recycle (new image booting)
          #   -> retry quickly (60s); this is the GOOD signal.
          echo "Waiting 10m for the warm container instance to sleep (sleepAfter=10m)..."
          sleep 600
          for i in $(seq 1 20); do
            BODY=$(curl -s --max-time 5 https://skipwait.me/api/health 2>/dev/null || true)
            SHA=$(echo "$BODY" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('commitSha',''))" 2>/dev/null || true)
            if [ "$SHA" = "$EXPECTED_SHA" ]; then echo "SYNC OK: live API reports $SHA"; exit 0; fi
            if [ -z "$SHA" ]; then
              echo "attempt $i: empty response — instance recycling (new image booting), retrying in 60s"
              sleep 60
            else
              echo "attempt $i: got '${SHA:0:7}' want ${EXPECTED_SHA:0:7} — the check woke the OLD instance; sleeping a full 10m cycle"
              sleep 600
            fi
          done
          echo "SYNC FAILED: live API did not report the pushed commit"; exit 1

      - name: Append sync log
        if: always()
        run: bash scripts/append-sync-log.sh "${{ github.workflow }}" "${{ github.sha }}" "${{ job.status }}"

      - name: Commit sync log back to main
        if: always()
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@skipwait.me"
          git add docs/SYNC_LOG.md
          if git diff --cached --quiet; then
            echo "no sync log change to commit"
          else
            git commit -m "Sync log: ${{ github.workflow }} ${{ github.sha }} ${{ job.status }} [skip ci]"
            git push origin HEAD:main
          fi

      - name: Notify sync status
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const status = `${{ job.status }}`;
            const msg = status === 'success' ? '✅ Sync succeeded' : '❌ Sync failed';
            // Notification must never fail the job: wrap in try/catch so a
            // missing issue or missing permissions only logs a warning.
            try {
              const issues = await github.rest.issues.listForRepo({
                owner: context.repo.owner, repo: context.repo.repo, state: 'all', per_page: 1
              });
              if (issues.data.length > 0) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issues.data[0].number,
                  body: `${msg} — workflow: ${{ github.workflow }}, commit: ${{ github.sha }}`
                });
                console.log('Notification posted to issue #' + issues.data[0].number);
              } else {
                console.log('No issue found to notify — skipping (non-fatal).');
              }
            } catch (err) {
              console.log('Notification skipped (non-fatal): ' + err.message);
            }
