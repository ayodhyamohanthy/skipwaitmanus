name: Deploy API (Cloudflare Containers)

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "shared/**"
      - "drizzle/**"
      - "scripts/apply-deploy-migrations.sh"
      - "scripts/lint-deploy-migrations.sh"
      - "src/worker.ts"
      - "Dockerfile"
      - ".dockerignore"
      - "wrangler.jsonc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "patches/**"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/deploy-api.yml"
      - "scripts/classify-api-changes.sh"
      - "scripts/verify-cloudflare-container-release.sh"
      - "scripts/assert-api-workflow-selection.sh"
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

# ──────────────────────────────────────────────
# EXTENSION POINT: add a new step here for each
# additional target system (Vercel, Netlify, …).
# See scripts/sync-manifest.json for the schema.
# ──────────────────────────────────────────────

permissions:
  contents: write
  issues: write
  # The release gate reads the CI runs of this commit (P1-deploy-green-gate, #748).
  actions: read

jobs:
  # P1-deploy-green-gate (#748): nothing below touches production until CI has
  # passed on this exact commit. Every job needs this one, directly or through
  # migrate-db; it waits for CI and refuses on red, cancelled, skipped, missing,
  # still running at the timeout, a GitHub error, or a commit production has
  # already moved past. Manual recovery: dispatch this workflow on main once
  # main's CI is green (dispatch CI on main first if the tip skipped CI).
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Require green CI on this exact commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/require-green-release.mjs --target api

  # Migration-first gate: pending drizzle/deploy/*.sql must apply to production
  # MySQL before any API image ships, so code can never run ahead of its tables.
  # A failure here fails the run and the deploy job never starts.
  migrate-db:
    needs: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # A re-run of this job alone skips release-gate, so it checks again itself.
      - name: Re-check green CI before migrating
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/require-green-release.mjs --target api --once
      - name: Apply pending production migrations
        env:
          DB_HOST: ${{ vars.SKIPWAIT_NEWDB_HOST }}
          DB_USER: ${{ vars.SKIPWAIT_NEWDB_USER }}
          DB_NAME: ${{ vars.SKIPWAIT_DB_NAME }}
          DB_PORT: ${{ vars.SKIPWAIT_DB_PORT }}
          MYSQL_PWD: ${{ secrets.SKIPWAIT_NEWDB_PASSWORD }}
        run: bash scripts/apply-deploy-migrations.sh

  deploy:
    needs: migrate-db
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify pushed changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          last=$(git rev-parse --verify refs/tags/api-runtime^{commit} 2>/dev/null || true)
          result=$(LAST_DEPLOYED_SHA="$last" bash scripts/classify-api-changes.sh)
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            result="classification=runtime"
          fi
          echo "$result" >> "$GITHUB_OUTPUT"
          echo "$result"

      - uses: pnpm/action-setup@v4
        if: steps.changes.outputs.classification != 'skip'

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.classification != 'skip'
        with:
          node-version: 22
          cache: pnpm

      - name: Record commit SHA
        if: steps.changes.outputs.classification == 'runtime'
        run: echo "${{ github.sha }}" > commit-sha.txt

      - name: Install dependencies
        if: steps.changes.outputs.classification != 'skip'
        run: pnpm install --frozen-lockfile

      - name: Assert API workflow selection
        if: steps.changes.outputs.classification != 'skip'
        run: bash scripts/assert-api-workflow-selection.sh

      - name: Typecheck
        if: steps.changes.outputs.classification == 'runtime'
        run: npx tsc --noEmit

      - name: Build bundle
        if: steps.changes.outputs.classification == 'runtime'
        run: pnpm build

      # Last look before the first production write: CI may have been re-run red
      # since release-gate passed, or this job alone may be a re-run.
      - name: Re-check green CI before deploying
        if: steps.changes.outputs.classification == 'runtime'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/require-green-release.mjs --target api --once

      - name: Ensure admin smoke signing secret exists
        if: steps.changes.outputs.classification == 'runtime'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +x
          if ! npx wrangler secret list | jq -e '.[] | select(.name == "ADMIN_SMOKE_SECRET")' >/dev/null; then
            openssl rand -base64 32 | npx wrangler secret put ADMIN_SMOKE_SECRET >/dev/null
          fi

      - name: Assert smoke secret hygiene
        if: steps.changes.outputs.classification == 'runtime'
        run: bash scripts/assert-smoke-secret-hygiene.sh

      - name: Capture current Cloudflare application version
        if: steps.changes.outputs.classification == 'runtime'
        run: |
          # Control-plane read permissions vary by scoped token. The active
          # version is advisory; exact baked SHA + readiness remain hard gates.
          echo "BEFORE_VERSION=" >> "$GITHUB_ENV"
          echo "BEFORE_IMAGE=" >> "$GITHUB_ENV"

      - name: Stamp release identity into Cloudflare configuration
        if: steps.changes.outputs.classification == 'runtime'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          node -e 'const fs=require("fs");const p="wrangler.jsonc";let s=fs.readFileSync(p,"utf8");s=s.replace(/"API_RELEASE":\s*"[^"]+"/, `"API_RELEASE": "${process.env.EXPECTED_SHA}"`);fs.writeFileSync(p,s)'

      - name: Deploy container image + worker
        id: deploy
        if: steps.changes.outputs.classification == 'runtime'
        run: bash scripts/deploy-cloudflare-two-phase.sh
        env:
          NEWDB_HOST: ${{ vars.SKIPWAIT_NEWDB_HOST }}
          NEWDB_USER: ${{ vars.SKIPWAIT_NEWDB_USER }}
          NEWDB_PASSWORD: ${{ secrets.SKIPWAIT_NEWDB_PASSWORD }}
          EXPECTED_SHA: ${{ github.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify administrator sign-in gate
        if: steps.changes.outputs.classification == 'runtime'
        run: |
          expected=$(node -e 'let s=require("fs").readFileSync("wrangler.jsonc","utf8");process.stdout.write(s.match(/"SKIPWAIT_ADMIN_EMAIL":\s*"([^"]+)"/)?.[1]||"")')
          test -n "$expected"
          allowed=$(curl -sS -o /dev/null -w '%{http_code}' --get --data-urlencode "email=$expected" https://skipwait.me/api/auth/workos/admin)
          denied=$(curl -sS -o /dev/null -w '%{http_code}' --get --data-urlencode 'email=wrong-admin@example.com' https://skipwait.me/api/auth/workos/admin)
          test "$allowed" = 302 || { echo "::error::Configured admin gate returned $allowed, expected 302"; exit 1; }
          test "$denied" = 403 || { echo "::error::Wrong admin gate returned $denied, expected 403"; exit 1; }

      - name: Verify active Cloudflare container release
        # This is the acceptance gate. The api-runtime marker below must never
        # move until Cloudflare proves the exact active version, image, baked
        # commit SHA, and ready state for this release.
        if: steps.changes.outputs.classification == 'runtime'
        env:
          EXPECTED_SHA: ${{ github.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/verify-cloudflare-container-release.sh
      - name: Validate deploy pipeline fixtures
        if: steps.changes.outputs.classification == 'pipeline'
        run: pnpm vitest run client/src/pipeline/apiChangeClassification.test.ts server/cloudflareContainerRelease.test.ts scripts/requireGreenRelease.test.ts

      - name: Report pipeline-only validation
        if: steps.changes.outputs.classification == 'pipeline'
        run: echo "PIPELINE VALIDATED; runtime unchanged at $(git rev-parse --verify refs/tags/api-runtime^{commit} 2>/dev/null || echo unknown)"

      - name: Update deployed runtime marker
        if: steps.changes.outputs.classification == 'runtime'
        run: |
          git tag -f api-runtime "${{ github.sha }}"
          git push -f origin refs/tags/api-runtime

      - name: Record sync status in workflow summary
        if: always() && steps.changes.outputs.classification != 'skip'
        run: |
          printf '### %s\n- commit: `%s`\n- status: `%s`\n' \
            "${{ github.workflow }}" "${{ github.sha }}" "${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Notify sync status
        if: always() && steps.changes.outputs.classification != 'skip'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            // REL-release-verify (D-212): one "Deploy failed: <workflow>" issue
            // labelled incident, opened or updated on failure and closed on the
            // next success, never a comment on whichever issue is newest.
            // Notification must never fail the job: a missing permission only logs.
            const status = `${{ job.status }}`;
            const title = `Deploy failed: ${{ github.workflow }}`;
            const { owner, repo } = context.repo;
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            try {
              const open = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', labels: 'incident', per_page: 100 });
              const existing = open.find(issue => issue.title === title && !issue.pull_request);
              if (status === 'success') {
                if (existing) {
                  await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body: `Deploy succeeded at ${{ github.sha }}: ${run}` });
                  await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
                  console.log('Closed #' + existing.number);
                }
              } else {
                try {
                  await github.rest.issues.createLabel({ owner, repo, name: 'incident', color: 'B60205' });
                } catch (err) {
                  if (err.status !== 422) throw err;
                }
                const body = `Deploy ${status} — workflow: ${{ github.workflow }}, commit: ${{ github.sha }}, run: ${run}`;
                if (existing) {
                  await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
                  console.log('Updated #' + existing.number);
                } else {
                  const created = await github.rest.issues.create({ owner, repo, title, body, labels: ['incident'] });
                  console.log('Opened #' + created.data.number);
                }
              }
            } catch (err) {
              console.log('Notification skipped (non-fatal): ' + err.message);
            }
