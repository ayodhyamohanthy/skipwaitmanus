name: Deploy API (Cloudflare Containers)

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "shared/**"
      - "drizzle/**"
      - "src/worker.ts"
      - "Dockerfile"
      - ".dockerignore"
      - "wrangler.jsonc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "patches/**"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/deploy-api.yml"
      - "scripts/classify-api-changes.sh"
      - "scripts/verify-cloudflare-container-release.sh"
      - "scripts/assert-api-workflow-selection.sh"
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

# ──────────────────────────────────────────────
# EXTENSION POINT: add a new step here for each
# additional target system (Vercel, Netlify, …).
# See scripts/sync-manifest.json for the schema.
# ──────────────────────────────────────────────

permissions:
  contents: write
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify pushed changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          last=$(git rev-parse --verify refs/tags/api-runtime^{commit} 2>/dev/null || true)
          result=$(LAST_DEPLOYED_SHA="$last" bash scripts/classify-api-changes.sh)
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            result="classification=runtime"
          fi
          echo "$result" >> "$GITHUB_OUTPUT"
          echo "$result"

      - uses: pnpm/action-setup@v4
        if: steps.changes.outputs.classification != 'skip'

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.classification != 'skip'
        with:
          node-version: 22
          cache: pnpm

      - name: Record commit SHA
        if: steps.changes.outputs.classification == 'runtime'
        run: echo "${{ github.sha }}" > commit-sha.txt

      - name: Install dependencies
        if: steps.changes.outputs.classification != 'skip'
        run: pnpm install --frozen-lockfile

      - name: Assert API workflow selection
        if: steps.changes.outputs.classification != 'skip'
        run: bash scripts/assert-api-workflow-selection.sh

      - name: Typecheck
        if: steps.changes.outputs.classification == 'runtime'
        run: npx tsc --noEmit

      - name: Build bundle
        if: steps.changes.outputs.classification == 'runtime'
        run: pnpm build

      - name: Ensure admin smoke signing secret exists
        if: steps.changes.outputs.classification == 'runtime'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +x
          if ! npx wrangler secret list | jq -e '.[] | select(.name == "ADMIN_SMOKE_SECRET")' >/dev/null; then
            openssl rand -base64 32 | npx wrangler secret put ADMIN_SMOKE_SECRET >/dev/null
          fi

      - name: Assert smoke secret hygiene
        if: steps.changes.outputs.classification == 'runtime'
        run: bash scripts/assert-smoke-secret-hygiene.sh

      - name: Capture current Cloudflare application version
        if: steps.changes.outputs.classification == 'runtime'
        run: |
          # Control-plane read permissions vary by scoped token. The active
          # version is advisory; exact baked SHA + readiness remain hard gates.
          echo "BEFORE_VERSION=" >> "$GITHUB_ENV"
          echo "BEFORE_IMAGE=" >> "$GITHUB_ENV"

      - name: Stamp release identity into Cloudflare configuration
        if: steps.changes.outputs.classification == 'runtime'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          node -e 'const fs=require("fs");const p="wrangler.jsonc";let s=fs.readFileSync(p,"utf8");s=s.replace(/"API_RELEASE":\s*"[^"]+"/, `"API_RELEASE": "${process.env.EXPECTED_SHA}"`);fs.writeFileSync(p,s)'

      - name: Deploy container image + worker
        if: steps.changes.outputs.classification == 'runtime'
        run: bash scripts/deploy-cloudflare-two-phase.sh
        env:
          EXPECTED_SHA: ${{ github.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify administrator sign-in gate
        if: steps.changes.outputs.classification == 'runtime'
        run: |
          expected=$(node -e 'let s=require("fs").readFileSync("wrangler.jsonc","utf8");process.stdout.write(s.match(/"SKIPWAIT_ADMIN_EMAIL":\s*"([^"]+)"/)?.[1]||"")')
          test -n "$expected"
          allowed=$(curl -sS -o /dev/null -w '%{http_code}' --get --data-urlencode "email=$expected" https://skipwait.me/api/auth/workos/admin)
          denied=$(curl -sS -o /dev/null -w '%{http_code}' --get --data-urlencode 'email=wrong-admin@example.com' https://skipwait.me/api/auth/workos/admin)
          test "$allowed" = 302 || { echo "::error::Configured admin gate returned $allowed, expected 302"; exit 1; }
          test "$denied" = 403 || { echo "::error::Wrong admin gate returned $denied, expected 403"; exit 1; }

      - name: Verify active Cloudflare container release
        # This is the acceptance gate. The api-runtime marker below must never
        # move until Cloudflare proves the exact active version, image, baked
        # commit SHA, and ready state for this release.
        if: steps.changes.outputs.classification == 'runtime'
        env:
          EXPECTED_SHA: ${{ github.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/verify-cloudflare-container-release.sh
      - name: Validate deploy pipeline fixtures
        if: steps.changes.outputs.classification == 'pipeline'
        run: pnpm vitest run client/src/pipeline/apiChangeClassification.test.ts server/cloudflareContainerRelease.test.ts

      - name: Report pipeline-only validation
        if: steps.changes.outputs.classification == 'pipeline'
        run: echo "PIPELINE VALIDATED; runtime unchanged at $(git rev-parse --verify refs/tags/api-runtime^{commit} 2>/dev/null || echo unknown)"

      - name: Update deployed runtime marker
        if: steps.changes.outputs.classification == 'runtime'
        run: |
          git tag -f api-runtime "${{ github.sha }}"
          git push -f origin refs/tags/api-runtime

      - name: Record sync status in workflow summary
        if: always() && steps.changes.outputs.classification != 'skip'
        run: |
          printf '### %s\n- commit: `%s`\n- status: `%s`\n' \
            "${{ github.workflow }}" "${{ github.sha }}" "${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Notify sync status
        if: always() && steps.changes.outputs.classification != 'skip'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const status = `${{ job.status }}`;
            const msg = status === 'success' ? '✅ Sync succeeded' : '❌ Sync failed';
            // Notification must never fail the job: wrap in try/catch so a
            // missing issue or missing permissions only logs a warning.
            try {
              const issues = await github.rest.issues.listForRepo({
                owner: context.repo.owner, repo: context.repo.repo, state: 'all', per_page: 1
              });
              if (issues.data.length > 0) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issues.data[0].number,
                  body: `${msg} — workflow: ${{ github.workflow }}, commit: ${{ github.sha }}`
                });
                console.log('Notification posted to issue #' + issues.data[0].number);
              } else {
                console.log('No issue found to notify — skipping (non-fatal).');
              }
            } catch (err) {
              console.log('Notification skipped (non-fatal): ' + err.message);
            }
