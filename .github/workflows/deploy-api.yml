name: Deploy API (Cloudflare Containers)

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "shared/**"
      - "drizzle/**"
      - "src/worker.ts"
      - "Dockerfile"
      - "wrangler.jsonc"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

# ──────────────────────────────────────────────
# EXTENSION POINT: add a new step here for each
# additional target system (Vercel, Netlify, …).
# See scripts/sync-manifest.json for the schema.
# ──────────────────────────────────────────────

permissions:
  contents: write
  issues: write

jobs:
  deploy:
    # `workflow_dispatch` can be started from ANY branch, and this job runs
    # `npx wrangler deploy`, which ships whatever ref was checked out. Gate it on
    # main so a manual dispatch from a feature branch cannot deploy unreviewed code.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Record commit SHA
        run: echo "${{ github.sha }}" > commit-sha.txt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build bundle
        run: pnpm build

      - name: Deploy container image + worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Record deployment (container boot is NOT verified here)
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          # This step does NOT verify that the container is serving the new code.
          # It previously printed "SYNC ACCEPTED", asserting a deployment it had
          # never checked — so a container that failed to boot still reported
          # success. That was a false assurance, not a verification.
          #
          # Polling /api/health would be a real check, but it RESETS the
          # container's 10-minute idle timer and stops it recycling, so it costs
          # money on every deploy. The Pages workflow does poll skipwait.me for the
          # baked commit; /api/health exposes `commitSha` for a manual check:
          #   curl -s https://skipwait.me/api/health
          echo "Uploaded: $EXPECTED_SHA"
          echo "NOT VERIFIED: this job does not confirm the container booted with it."
          echo "Check manually with: curl -s https://skipwait.me/api/health"
          exit 0
      - name: Append sync log
        if: always()
        run: bash scripts/append-sync-log.sh "${{ github.workflow }}" "${{ github.sha }}" "${{ job.status }}"

      - name: Commit sync log back to main
        if: always()
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@skipwait.me"
          git add docs/SYNC_LOG.md
          if git diff --cached --quiet; then
            echo "no sync log change to commit"
            exit 0
          fi
          git commit -m "Sync log: ${{ github.workflow }} ${{ github.sha }} ${{ job.status }} [skip ci]"
          # The API and Pages workflows push the log concurrently; rebase-retry
          # so a simultaneous push cannot fail the job (non-fatal if it still fails).
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main 2>/dev/null; then echo "sync log pushed"; exit 0; fi
            echo "push attempt $attempt collided — rebasing and retrying"
            git fetch origin main --quiet
            git rebase origin/main --autostash 2>/dev/null || git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "sync log push failed after retries (non-fatal)"; exit 0

      - name: Notify sync status
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const status = `${{ job.status }}`;
            const msg = status === 'success' ? '✅ Sync succeeded' : '❌ Sync failed';
            // Notification must never fail the job: wrap in try/catch so a
            // missing issue or missing permissions only logs a warning.
            try {
              const issues = await github.rest.issues.listForRepo({
                owner: context.repo.owner, repo: context.repo.repo, state: 'all', per_page: 1
              });
              if (issues.data.length > 0) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issues.data[0].number,
                  body: `${msg} — workflow: ${{ github.workflow }}, commit: ${{ github.sha }}`
                });
                console.log('Notification posted to issue #' + issues.data[0].number);
              } else {
                console.log('No issue found to notify — skipping (non-fatal).');
              }
            } catch (err) {
              console.log('Notification skipped (non-fatal): ' + err.message);
            }
