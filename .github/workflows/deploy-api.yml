name: Deploy API (Cloudflare Containers)

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "shared/**"
      - "drizzle/**"
      - "src/worker.ts"
      - "Dockerfile"
      - "wrangler.jsonc"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

# ──────────────────────────────────────────────
# EXTENSION POINT: add a new step here for each
# additional target system (Vercel, Netlify, …).
# See scripts/sync-manifest.json for the schema.
# ──────────────────────────────────────────────

permissions:
  contents: write
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Record commit SHA
        run: echo "${{ github.sha }}" > commit-sha.txt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assert API workflow selection
        run: bash scripts/assert-api-workflow-selection.sh

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build bundle
        run: pnpm build

      - name: Ensure admin smoke signing secret exists
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +x
          if ! npx wrangler secret list --json | jq -e '.[] | select(.name == "ADMIN_SMOKE_SECRET")' >/dev/null; then
            openssl rand -base64 32 | npx wrangler secret put ADMIN_SMOKE_SECRET >/dev/null
          fi

      - name: Assert smoke secret hygiene
        run: bash scripts/assert-smoke-secret-hygiene.sh

      - name: Deploy container image + worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify deployment recorded (Cloudflare API)
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          # The wrangler deploy step above succeeded, which uploads the new
          # image.  Cloudflare records that deployment immediately — no need
          # to poll the container (polling the health endpoint RESETS the
          # 10m idle timer and prevents recycling).
          echo "Deployment recorded: $EXPECTED_SHA was pushed to Cloudflare."
          echo "SYNC ACCEPTED: API commit $EXPECTED_SHA is deployed to Cloudflare Containers (container recycles on idle)."; exit 0
      - name: Append sync log
        if: always()
        run: bash scripts/append-sync-log.sh "${{ github.workflow }}" "${{ github.sha }}" "${{ job.status }}"

      - name: Commit sync log back to main
        if: always()
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@skipwait.me"
          git add docs/SYNC_LOG.md
          if git diff --cached --quiet; then
            echo "no sync log change to commit"
            exit 0
          fi
          git commit -m "Sync log: ${{ github.workflow }} ${{ github.sha }} ${{ job.status }} [skip ci]"
          # The API and Pages workflows push the log concurrently; rebase-retry
          # so a simultaneous push cannot fail the job (non-fatal if it still fails).
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main 2>/dev/null; then echo "sync log pushed"; exit 0; fi
            echo "push attempt $attempt collided — rebasing and retrying"
            git fetch origin main --quiet
            git rebase origin/main --autostash 2>/dev/null || git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "sync log push failed after retries (non-fatal)"; exit 0

      - name: Notify sync status
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const status = `${{ job.status }}`;
            const msg = status === 'success' ? '✅ Sync succeeded' : '❌ Sync failed';
            // Notification must never fail the job: wrap in try/catch so a
            // missing issue or missing permissions only logs a warning.
            try {
              const issues = await github.rest.issues.listForRepo({
                owner: context.repo.owner, repo: context.repo.repo, state: 'all', per_page: 1
              });
              if (issues.data.length > 0) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issues.data[0].number,
                  body: `${msg} — workflow: ${{ github.workflow }}, commit: ${{ github.sha }}`
                });
                console.log('Notification posted to issue #' + issues.data[0].number);
              } else {
                console.log('No issue found to notify — skipping (non-fatal).');
              }
            } catch (err) {
              console.log('Notification skipped (non-fatal): ' + err.message);
            }
