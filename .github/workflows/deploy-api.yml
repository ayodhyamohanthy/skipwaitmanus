name: Deploy API (Cloudflare Containers)

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "shared/**"
      - "drizzle/**"
      - "src/worker.ts"
      - "Dockerfile"
      - "wrangler.jsonc"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Record commit SHA
        run: echo "${{ github.sha }}" > commit-sha.txt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build bundle
        run: pnpm build

      - name: Deploy container image + worker
        run: npx wrangler deploy

      - name: Verify live API serves the pushed commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for i in $(seq 1 12); do
            BODY=$(curl -s https://skipwait.me/api/health || true)
            SHA=$(echo "$BODY" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('commitSha',''))" 2>/dev/null || true)
            if [ "$SHA" = "$EXPECTED_SHA" ]; then echo "SYNC OK: live API reports $SHA"; exit 0; fi
            echo "attempt $i: got '${SHA:0:7}' want ${EXPECTED_SHA:0:7} — waiting for container rollout"; sleep 20
          done
          echo "SYNC FAILED: live API did not report the pushed commit after retries"; exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
