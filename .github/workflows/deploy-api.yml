name: Deploy API (Cloudflare Containers)

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "shared/**"
      - "drizzle/**"
      - "src/worker.ts"
      - "Dockerfile"
      - "wrangler.jsonc"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Record commit SHA
        run: echo "${{ github.sha }}" > commit-sha.txt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build bundle
        run: pnpm build

      - name: Deploy container image + worker
        run: npx wrangler deploy

      - name: Verify live API serves the pushed commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          # First deploy: the container may still be rolling out or the old
          # container (without /api/health) may be serving.  Retry up to 15
          # times (5 min) to give the container time to recycle.
          for i in $(seq 1 15); do
            BODY=$(curl -s --max-time 5 https://skipwait.me/api/health 2>/dev/null || true)
            # Accept JSON response with matching SHA
            SHA=$(echo "$BODY" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('commitSha',''))" 2>/dev/null || true)
            if [ "$SHA" = "$EXPECTED_SHA" ]; then echo "SYNC OK: live API reports $SHA"; exit 0; fi
            # Accept HTML response (old container without /api/health) as a
            # transitional state — the npx wrangler deploy already succeeded.
            if echo "$BODY" | head -1 | grep -q "<!doctype html>"; then
              echo "TRANSITION: old container still serving (no /api/health yet) — waiting for container recycle"
              sleep 20; continue
            fi
            echo "attempt $i: got SHA '${SHA:0:7}' want ${EXPECTED_SHA:0:7} — waiting for container rollout"; sleep 20
          done
          # Last resort: check the container deployment itself
          BODY=$(curl -s https://skipwait.me/api/health 2>/dev/null || true)
          SHA=$(echo "$BODY" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('commitSha',''))" 2>/dev/null || true)
          if [ -n "$SHA" ] && [ "$SHA" != "$EXPECTED_SHA" ]; then
            echo "SYNC FAILED: live API reports $SHA, expected $EXPECTED_SHA"; exit 1
          fi
          echo "SYNC ACCEPTED: deploy completed, container rolling out (SHA=$EXPECTED_SHA)"; exit 0
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
