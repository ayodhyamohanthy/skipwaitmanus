name: Design Gate (Impeccable)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "client/src/pages/**"
      - "client/src/components/**"
      - "client/src/index.css"

# Least privilege. Without an explicit block the job inherits the repository
# default, which is write-all on many repos — and the step below executes
# third-party code fetched at run time.
permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Impeccable detector on changed client surfaces
        # Pinned, not @latest: this downloads and executes third-party code inside
        # CI, so the version should only change deliberately. `|| true` keeps the
        # gate advisory — a detector failure must not block a deploy.
        run: |
          npx -y impeccable@4.1.0 detect client/src/pages client/src/components --quiet || true
      - name: Record result
        run: echo "Design gate run complete — findings are advisory; blocking rules reviewed in PR."
