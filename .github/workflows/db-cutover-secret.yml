name: DB cutover - set Worker DATABASE_URL (manual, does not deploy)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'type skipwait to set DATABASE_URL to the NEW server, database skipwait'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: db-cutover-secret
  cancel-in-progress: false

jobs:
  set:
    if: inputs.confirm == 'skipwait'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify NEW skipwait is populated, then set DATABASE_URL
        env:
          NEW_HOST: ${{ vars.SKIPWAIT_NEWDB_HOST }}
          NEW_USER: ${{ vars.SKIPWAIT_NEWDB_USER }}
          NEW_PWD: ${{ secrets.SKIPWAIT_NEWDB_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +x
          command -v mysql >/dev/null || { sudo apt-get update -y >/dev/null && sudo apt-get install -y mysql-client >/dev/null; }
          n=$(MYSQL_PWD="$NEW_PWD" mysql --host="$NEW_HOST" --user="$NEW_USER" --ssl-mode=REQUIRED -N -B -e "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='skipwait'")
          [ "$n" -ge 80 ] || { echo "REFUSING: NEW skipwait has $n tables"; exit 3; }
          enc=$(node -e 'process.stdout.write(encodeURIComponent(process.env.NEW_PWD))')
          printf '%s' "mysql://$NEW_USER:$enc@$NEW_HOST:3306/skipwait" | npx wrangler secret put DATABASE_URL >/dev/null
          echo "DATABASE_URL secret set to NEW server (value not printed)"
