name: Rotate QA gate secret

# Force-updates the skipwait-qa worker's QA_GATE_SECRET from the repo secret
# SKIPWAIT_QA_GATE and redeploys to bind it. Manual only. The deploy-qa
# pipeline's ensure step skips secrets that already exist, so rotation lives
# here. The secret VALUE only ever moves GitHub-secret -> worker-secret; it
# is never printed (wrangler masks it, printf keeps it off argv).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Force-put QA_GATE_SECRET on the qa worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GATE: ${{ secrets.SKIPWAIT_QA_GATE }}
        run: printf '%s' "$GATE" | npx wrangler secret put QA_GATE_SECRET --env qa
      - name: Redeploy to bind the rotated secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env qa
