name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck
    runs-on: [self-hosted, skipwait-mac]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm check

  test:
    name: unit + component + route tests
    runs-on: [self-hosted, skipwait-mac]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Vitest
        # TODO(#25): drop the --exclude list once fix/settings-trpc-test-mocks
        # lands. These three suites need the tRPC mock harness from that PR;
        # everything else must stay green.
        run: >-
          pnpm vitest run
          --exclude client/src/pages/settings.workEmail.test.tsx
          --exclude client/src/pages/settings.slackTriage.test.tsx
          --exclude client/src/pages/policyPages.test.tsx

  build:
    name: production build
    runs-on: [self-hosted, skipwait-mac]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
