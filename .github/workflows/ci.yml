name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI-architect-real-checks (#748/#752). These three jobs are the required checks
# on main (ruleset 25433342). They used to skip every `agent/reports/`,
# `agent/review/`, `agent/heartbeat/` and `agent/architect/` pull request, which
# also skipped substantive architect packet pull requests: #752 and #764 merged
# with all three jobs skipped, and GitHub counts a skipped required job as
# passed.
#
# The condition below is the whole skip rule now: a pull request may skip only
# when its own diff is empty, as counted by GitHub at the pinned base and head.
# `changed_files`, `additions` and `deletions` must all be exactly the number 0.
# A branch name, title, message or label is never an input, so a runtime or
# docs/registry change runs the full steps wherever it is pushed.
#
# `toJSON()` is deliberate: `==` coerces, so `changed_files == 0` would also
# accept the string "0". `toJSON()` returns `0` for the number and `"0"` for the
# string, so only a real numeric zero takes the fast path. A missing, null,
# negative or malformed count fails the comparison and runs the checks.
#
# Every other event - a push to main, a dispatch, a re-run - falls through to
# running, because the condition is gated on `pull_request`. Nothing here uses
# `needs:`, so no classifier can fail and leave a required job skipped.
#
# Each job then re-reads the same pinned pair itself and fails if it is running
# while that diff is empty (`scripts/classifyCiChange.mjs --expect-substantive`),
# so a wrong count cannot buy a green job that ran no real step.
jobs:
  check:
    if: ${{ !(github.event_name == 'pull_request' && toJSON(github.event.pull_request.changed_files) == '0' && toJSON(github.event.pull_request.additions) == '0' && toJSON(github.event.pull_request.deletions) == '0') }}
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # The pinned pair, never a branch name. A failed fetch is not fatal: the
      # classifier then reports an unreadable diff and the full steps run.
      - name: Fetch the pinned base and head
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA"
      - name: Classify the change from the pinned diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/classifyCiChange.mjs --expect-substantive >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        # tsc needs more than the default old-space on this tree; OOM exits 1
        # with no diagnostics (verified: 8GB local run passes with zero errors).
        run: NODE_OPTIONS=--max-old-space-size=6144 pnpm check
      # scripts/design-token-audit.mjs already existed and already failed, but no
      # workflow ever ran it: design-gate.yml only invokes `impeccable detect`
      # behind `|| true`. So three off-brand hexes sat in the client surface
      # unnoticed. It is deterministic and fast, so it belongs on the blocking
      # path that runs for pull requests, not only on a push to main.
      - name: Design tokens
        run: node scripts/design-token-audit.mjs
      # Same class of dead guard: this one exists specifically to fail a workflow
      # edit whose path filter stops matching a build input, which is how the SEO
      # work merged on Sep 24 and never deployed. Nothing called it either.
      - name: Deploy trigger coverage
        run: node scripts/check-deploy-triggers.mjs
      # PICKER-owns-scope (docs/plans/PICKER-PARALLEL.md): judge what this branch changed
      # against the files its task declared it would touch. It reads the task from the
      # branch name, and fails open (with a warning) only when it cannot run at all, so a
      # broken tool never blocks a real fix — but a definite change outside `owns` fails.
      - name: Scope check (declared file ownership)
        run: node scripts/scope-check.mjs --branch

  test:
    if: ${{ !(github.event_name == 'pull_request' && toJSON(github.event.pull_request.changed_files) == '0' && toJSON(github.event.pull_request.additions) == '0' && toJSON(github.event.pull_request.deletions) == '0') }}
    name: unit + component + route tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Fetch the pinned base and head
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA"
      - name: Classify the change from the pinned diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/classifyCiChange.mjs --expect-substantive >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Vitest
        # The full suite runs here with no exclusions. The three suites that
        # used to be excluded for the missing tRPC mock harness now pass
        # (settings.workEmail, settings.slackTriage) or never needed excluding
        # (policyPages). Re-adding an --exclude here hides a red main.
        run: pnpm vitest run

  build:
    if: ${{ !(github.event_name == 'pull_request' && toJSON(github.event.pull_request.changed_files) == '0' && toJSON(github.event.pull_request.additions) == '0' && toJSON(github.event.pull_request.deletions) == '0') }}
    name: production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Fetch the pinned base and head
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA"
      - name: Classify the change from the pinned diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/classifyCiChange.mjs --expect-substantive >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Build with all goal surfaces on
        run: pnpm build
        env:
          VITE_GOAL_SURFACES: all
