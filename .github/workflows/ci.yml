name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  merge_group:
    types: [checks_requested]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI-architect-real-checks (#748/#752). These three jobs are the required checks
# on main (ruleset 25433342). They used to skip every `agent/reports/`,
# `agent/review/`, `agent/heartbeat/` and `agent/architect/` pull request, which
# also skipped substantive architect packet pull requests: #752 and #764 merged
# with all three jobs skipped, and GitHub counts a skipped required job as
# passed.
#
# H1 (owner source review, Oct 28): the first correction put the empty-diff test
# in a job-level `if:` that read the event's own counts. That left the same hole
# one level up - a wrong count skipped the job, so no classifier step ever ran.
# The required jobs now always start. Each one classifies its own pinned diff
# first, and only a verified empty diff lets it skip steps. A count that says
# empty next to a diff that is not empty fails the job red.
#
# The classifier is the only skip rule: exactly zero changed files between the
# pinned base and head, read from a real merge base, on a pull request against
# the default branch (M1). A branch name, title, message or label is never an
# input, so a runtime or docs/registry change runs the full steps wherever it is
# pushed. Every unreadable, shallow, truncated or contradictory read runs the
# full steps.
#
# Only one job uses `needs:`: the required `unit + component + route tests`
# aggregate over the three unit-test shards (GATE-unit-shards, D-351). A job that
# needs a failed or skipped job is itself skipped, and a skipped required job
# counts as passed, so the aggregate runs with `if: ${{ always() }}` and fails
# unless the shards' combined result is `success`. Every job that does work
# still starts on every event and classifies its own pinned diff. The one other
# `needs:` is the non-required release-capture job waiting on its planner
# (GATE-release-captures, at the end of this file); no required job reads either.
jobs:
  check:
    name: typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # The pinned pair, never a branch name. A failed fetch is not fatal: the
      # classifier then reports an unreadable diff and the full steps run.
      - name: Fetch the pinned base and head
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA"
          if ! git merge-base "$BASE_SHA" "$HEAD_SHA" >/dev/null 2>&1; then
            # L1: a depth-1 pair has no merge base, and an empty pinned pair
            # cannot prove the pull request is empty. Deepen until one resolves;
            # if it still does not, the classifier treats the read as substantive.
            git fetch --no-tags --deepen=100 origin "$BASE_SHA" "$HEAD_SHA" || true
          fi
          if ! git merge-base "$BASE_SHA" "$HEAD_SHA" >/dev/null 2>&1; then
            # H1 (review 5688160581): a long-lived marker branch forked more than
            # 100 commits behind main still has no merge base here. Fetch the full
            # history, as scripts/queue-gate.mjs already does. If a merge base
            # still does not resolve, the classifier keeps the read substantive.
            git fetch --no-tags --unshallow origin "$BASE_SHA" "$HEAD_SHA" || true
          fi
      - name: Classify the change from the pinned diff
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # H1: the event's own counts, evaluated here so `toJSON()` still tells
          # the number 0 from the string "0". The job always starts; this value
          # only lets the classifier fail red when the counts contradict the
          # pinned diff.
          EVENT_CLAIMED_EMPTY: ${{ github.event_name == 'pull_request' && toJSON(github.event.pull_request.changed_files) == '0' && toJSON(github.event.pull_request.additions) == '0' && toJSON(github.event.pull_request.deletions) == '0' }}
          # M1: only a pull request against the default branch may fast-path.
          BASE_IS_DEFAULT_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == github.event.repository.default_branch }}
        run: node scripts/classifyCiChange.mjs >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        # tsc needs more than the default old-space on this tree; OOM exits 1
        # with no diagnostics (verified: 8GB local run passes with zero errors).
        run: NODE_OPTIONS=--max-old-space-size=6144 pnpm check
      # scripts/design-token-audit.mjs already existed and already failed, but no
      # workflow ever ran it: design-gate.yml only invokes `impeccable detect`
      # behind `|| true`. So three off-brand hexes sat in the client surface
      # unnoticed. It is deterministic and fast, so it belongs on the blocking
      # path that runs for pull requests, not only on a push to main.
      - name: Design tokens
        run: node scripts/design-token-audit.mjs
      # Same class of dead guard: this one exists specifically to fail a workflow
      # edit whose path filter stops matching a build input, which is how the SEO
      # work merged on Sep 24 and never deployed. Nothing called it either.
      - name: Deploy trigger coverage
        run: node scripts/check-deploy-triggers.mjs
      # PICKER-owns-scope (docs/plans/PICKER-PARALLEL.md): judge what this branch changed
      # against the files its task declared it would touch. It reads the task from the
      # branch name, and fails open (with a warning) only when it cannot run at all, so a
      # broken tool never blocks a real fix - but a definite change outside `owns` fails.
      # A verified empty diff has no files to judge and no queue row to read (marker
      # branches never merge), so the classifier is the only thing that may skip it.
      # PICKER-gate-red-review-route (D-286): the review gate under its own step name. It is the same script and
      # exit code scope-check runs next (scope-check calls it again and gets the same answer), so nothing is
      # added, waived or reordered in what must pass; the name only lets the picker tell "red because the Tier 1
      # review is still to be done" from every other red, and hand that head its REVIEW. The step name is read by
      # scripts/nextTaskCore.mjs (GATE_STEP); keep the two identical. The job and its required-check name are unchanged.
      - name: Review gate (independent Tier 1 pass)
        if: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && steps.classify.outputs.marker_only != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/review-gate.mjs
      - name: Scope check (declared file ownership)
        if: ${{ steps.classify.outputs.marker_only != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/scope-check.mjs --branch

  # GATE-unit-shards (D-351): the unit suite runs as three parallel shards, each
  # with the same fetch, classify and install steps the single job had. The
  # required check name stays on the aggregate job below.
  test-shard:
    name: unit tests (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Fetch the pinned base and head
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA"
          if ! git merge-base "$BASE_SHA" "$HEAD_SHA" >/dev/null 2>&1; then
            git fetch --no-tags --deepen=100 origin "$BASE_SHA" "$HEAD_SHA" || true
          fi
          if ! git merge-base "$BASE_SHA" "$HEAD_SHA" >/dev/null 2>&1; then
            # H1 (review 5688160581): a long-lived marker branch forked more than
            # 100 commits behind main still has no merge base here. Fetch the full
            # history, as scripts/queue-gate.mjs already does. If a merge base
            # still does not resolve, the classifier keeps the read substantive.
            git fetch --no-tags --unshallow origin "$BASE_SHA" "$HEAD_SHA" || true
          fi
      - name: Classify the change from the pinned diff
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_CLAIMED_EMPTY: ${{ github.event_name == 'pull_request' && toJSON(github.event.pull_request.changed_files) == '0' && toJSON(github.event.pull_request.additions) == '0' && toJSON(github.event.pull_request.deletions) == '0' }}
          BASE_IS_DEFAULT_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == github.event.repository.default_branch }}
        run: node scripts/classifyCiChange.mjs >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        if: ${{ steps.classify.outputs.marker_only != 'true' }}
        run: pnpm install --frozen-lockfile
      - name: Vitest
        # The full suite runs across the three shards with no exclusions: each
        # shard takes its slice of the test files, and together they cover all
        # of them. The three suites that used to be excluded for the missing
        # tRPC mock harness now pass (settings.workEmail, settings.slackTriage)
        # or never needed excluding (policyPages). Re-adding an --exclude here
        # hides a red main.
        if: ${{ steps.classify.outputs.marker_only != 'true' }}
        run: pnpm vitest run --shard=${{ matrix.shard }}/3

  # The required check (ruleset 25433342). It always starts, waits for the
  # shards, and passes only when all three succeeded; anything else fails it.
  test:
    name: unit + component + route tests
    runs-on: ubuntu-latest
    needs: test-shard
    if: ${{ always() }}
    steps:
      - name: Every shard passed
        env:
          SHARDS: ${{ needs.test-shard.result }}
        run: |
          echo "unit test shards: $SHARDS"
          if [ "$SHARDS" != "success" ]; then
            echo "::error::The unit test shards ended '$SHARDS'. This check passes only when all three shards succeed."
            exit 1
          fi

  build:
    name: production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Fetch the pinned base and head
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA"
          if ! git merge-base "$BASE_SHA" "$HEAD_SHA" >/dev/null 2>&1; then
            git fetch --no-tags --deepen=100 origin "$BASE_SHA" "$HEAD_SHA" || true
          fi
          if ! git merge-base "$BASE_SHA" "$HEAD_SHA" >/dev/null 2>&1; then
            # H1 (review 5688160581): a long-lived marker branch forked more than
            # 100 commits behind main still has no merge base here. Fetch the full
            # history, as scripts/queue-gate.mjs already does. If a merge base
            # still does not resolve, the classifier keeps the read substantive.
            git fetch --no-tags --unshallow origin "$BASE_SHA" "$HEAD_SHA" || true
          fi
      - name: Classify the change from the pinned diff
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_CLAIMED_EMPTY: ${{ github.event_name == 'pull_request' && toJSON(github.event.pull_request.changed_files) == '0' && toJSON(github.event.pull_request.additions) == '0' && toJSON(github.event.pull_request.deletions) == '0' }}
          BASE_IS_DEFAULT_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == github.event.repository.default_branch }}
        run: node scripts/classifyCiChange.mjs >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        if: ${{ steps.classify.outputs.marker_only != 'true' }}
        run: pnpm install --frozen-lockfile
      - name: Build
        if: ${{ steps.classify.outputs.marker_only != 'true' }}
        run: pnpm build
      - name: Build with all goal surfaces on
        if: ${{ steps.classify.outputs.marker_only != 'true' }}
        run: pnpm build
        env:
          VITE_GOAL_SURFACES: all

  # GATE-e2e-journeys (D-212, docs/plans/GATE-delivery.md): the core journeys in
  # a real browser against the built server and a real MySQL, on every pull
  # request and every push to main. Not a required check until it has been green
  # on main for 3 days and the owner adds it (D-212 (6)). No `paths:` filter: a
  # docs-only change exits green in the first step instead.
  #
  # GATE-migration-apply (D-212): the schema step proves what a pull request's
  # deploy migrations do on the database `main` already has. It pushes the base
  # revision's drizzle/schema.ts, applies drizzle/deploy/*.sql twice (the second
  # run must apply nothing), then compares the result with the PR's own
  # schema.ts: a table or column no deploy migration creates fails here, not in
  # production's migrate-db. It reads repository files only - no production
  # database, dump or secret. A base revision it cannot resolve or push falls
  # back to the head schema and warns, so a broken tool never reddens a pull
  # request for a reason that is not a breach.
  e2e:
    name: e2e journeys
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: e2e
          MYSQL_DATABASE: skipwait
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pe2e"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      E2E_DATABASE_URL: mysql://root:e2e@127.0.0.1:3306/skipwait
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Docs-only change exits green
        id: docs
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # Fails open: an unreadable diff runs the journeys.
          files=$(git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA" 2>/dev/null) || { echo "docs_only=false" >> "$GITHUB_OUTPUT"; exit 0; }
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -Ev '^docs/|\.md$' >/dev/null; then
            echo "Only docs/** and *.md changed; the journeys do not run."
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        if: ${{ steps.docs.outputs.docs_only != 'true' }}
      - uses: actions/setup-node@v4
        if: ${{ steps.docs.outputs.docs_only != 'true' }}
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        if: ${{ steps.docs.outputs.docs_only != 'true' }}
        run: pnpm install --frozen-lockfile
      - name: Cache the Playwright browser
        if: ${{ steps.docs.outputs.docs_only != 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        if: ${{ steps.docs.outputs.docs_only != 'true' }}
        run: pnpm exec playwright install --with-deps chromium
      - name: Build
        if: ${{ steps.docs.outputs.docs_only != 'true' }}
        run: pnpm build
      - name: Base schema, deploy migrations applied twice, drift check
        if: ${{ steps.docs.outputs.docs_only != 'true' }}
        env:
          MIGRATION_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/e2e-server.mjs prepare
      - name: Journeys
        if: ${{ steps.docs.outputs.docs_only != 'true' }}
        run: pnpm e2e
      # These four synthetic UI fixtures are acceptance proof even on a green run.
      # Retain only the explicit consent captures, not successful signed-in traces.
      - name: Upload synthetic consent captures
        if: ${{ always() && hashFiles('e2e/.results/**/awaiting-*.png') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: consent-captures-${{ github.run_id }}-${{ github.run_attempt }}
          # .results is hidden; only the explicitly named synthetic PNGs are included.
          include-hidden-files: true
          path: |
            e2e/.results/**/awaiting-*.png
            e2e/.results/**/error-*.png
          retention-days: 1
          if-no-files-found: error
      - name: Upload synthetic company jobs captures
        if: ${{ always() && hashFiles('e2e/.results/**/company-jobs-*.png') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: company-jobs-captures-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: e2e/.results/**/company-jobs-*.png
          retention-days: 14
          if-no-files-found: error
      - name: Upload the Playwright trace and screenshots
        if: ${{ failure() && steps.docs.outputs.docs_only != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-journeys-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            e2e/.results
            e2e/.report
          retention-days: 14
          if-no-files-found: ignore

  # GATE-release-captures (D-346 (6), docs/plans/D-344-unblock.md row 4): CI
  # takes a page release's captures at 1280x900 and at 390x844 (scale 2), the
  # proof a release row used to capture by hand (AGENTS.md rule 8). Neither job
  # is a required check, and no required job reads them.
  #
  # The planner runs only on pull requests, with Node and no install, and
  # names the surfaces to capture from client/src/lib/goalSurfaces.ts: the
  # release row whose branch is this pull request's head (looked up in
  # docs/plans/assignments.json), every id the pull request adds to RELEASED,
  # and the canary surfaces when the capture tooling itself changes. Any other
  # pull request plans nothing, and the capture job does not start.
  capture-plan:
    name: release captures (plan)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      capture: ${{ steps.plan.outputs.capture }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      # The merge commit and its first parent: HEAD^1 is the base it merges into.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Plan the captures
        id: plan
        env:
          CAPTURE_BRANCH: ${{ github.head_ref }}
        run: node scripts/release-captures.mjs plan

  # One job per planned surface: build with only that surface switched on, sign
  # in through the e2e harness (synthetic accounts on a throwaway MySQL), and
  # upload every route's PNGs as the artifact `release-captures-<id>`.
  capture:
    name: release captures (${{ matrix.id }})
    runs-on: ubuntu-latest
    needs: capture-plan
    if: ${{ needs.capture-plan.outputs.capture == 'true' }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.capture-plan.outputs.matrix) }}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: e2e
          MYSQL_DATABASE: skipwait
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pe2e"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      E2E_DATABASE_URL: mysql://root:e2e@127.0.0.1:3306/skipwait
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build with this surface on
        env:
          VITE_GOAL_SURFACES: ${{ matrix.id }}
        run: pnpm build
      # The head schema and the deploy migrations, as the journeys get them; the
      # migration check against main's schema stays in the e2e journeys job.
      - name: Prepare the e2e database
        run: node scripts/e2e-server.mjs prepare
      - name: Capture every route at 1280 and 390
        env:
          RELEASE_CAPTURE_IDS: ${{ matrix.id }}
        run: pnpm exec playwright test -c e2e/playwright.config.ts e2e/release-captures.e2e.ts
      - name: Upload the captures
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-captures-${{ matrix.id }}
          path: e2e/.results/release-captures/${{ matrix.id }}
          retention-days: 30
          if-no-files-found: warn
