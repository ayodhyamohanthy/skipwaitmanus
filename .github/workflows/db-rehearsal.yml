name: DB move rehearsal (manual, never deploys)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'inventory (read-only on both) | rehearse (writes only skipwait_rehearsal on the NEW server) | verify (read-only on both)'
        required: true
        default: 'inventory'
        type: choice
        options: [inventory, rehearse, verify]

permissions:
  contents: read

concurrency:
  group: db-rehearsal
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Ensure MySQL client tools
        run: |
          command -v mysqldump >/dev/null || { sudo apt-get update -y >/dev/null && sudo apt-get install -y mysql-client >/dev/null; }
          mysql --version; mysqldump --version
      - name: Run ${{ inputs.mode }}
        env:
          OLD_HOST: ${{ vars.SKIPWAIT_DB_HOST }}
          OLD_USER: ${{ vars.SKIPWAIT_DB_USER }}
          OLD_NAME: ${{ vars.SKIPWAIT_DB_NAME }}
          OLD_PORT: ${{ vars.SKIPWAIT_DB_PORT }}
          OLD_PWD: ${{ secrets.SKIPWAIT_DB_PASSWORD }}
          NEW_HOST: ${{ vars.SKIPWAIT_NEWDB_HOST }}
          NEW_USER: ${{ vars.SKIPWAIT_NEWDB_USER }}
          NEW_PWD: ${{ secrets.SKIPWAIT_NEWDB_PASSWORD }}
        run: bash scripts/db-copy.sh "${{ inputs.mode }}"
