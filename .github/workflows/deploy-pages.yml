name: Deploy Web (Cloudflare Pages)

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "shared/**"
      - "functions/**"
      - "vite.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

concurrency:
  group: deploy-pages
  cancel-in-progress: false

# ──────────────────────────────────────────────
# EXTENSION POINT: add a new step here for each
# additional target system (Vercel, Netlify, …).
# See scripts/sync-manifest.json for the schema.
# ──────────────────────────────────────────────

permissions:
  contents: write
  issues: write

jobs:
  deploy:
    runs-on: [self-hosted, skipwait-mac]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm build
        env:
          VITE_WORKOS_CLIENT_ID: client_01M17TTFJ6784B1CN6MHAHB60Y
          VITE_WORKOS_ENABLED: "true"
          VITE_GIT_COMMIT_SHA: ${{ github.sha }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_CLARITY_PROJECT_ID: ${{ secrets.VITE_CLARITY_PROJECT_ID }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist/public --project-name skipwait --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify live site carries the pushed commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for i in $(seq 1 10); do
            if curl -s https://skipwait.me/ | grep -q "name=\"git-commit\" content=\"$EXPECTED_SHA\""; then
              echo "SYNC OK: live site carries $EXPECTED_SHA"; exit 0
            fi
            echo "attempt $i: SHA not live yet — waiting"; sleep 15
          done
          echo "SYNC FAILED: live site does not carry the pushed commit"; exit 1

      - name: Append sync log
        if: always()
        run: bash scripts/append-sync-log.sh "${{ github.workflow }}" "${{ github.sha }}" "${{ job.status }}"

      - name: Commit sync log back to main
        if: always()
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@skipwait.me"
          git add docs/SYNC_LOG.md
          if git diff --cached --quiet; then
            echo "no sync log change to commit"
            exit 0
          fi
          git commit -m "Sync log: ${{ github.workflow }} ${{ github.sha }} ${{ job.status }} [skip ci]"
          # The API and Pages workflows push the log concurrently; rebase-retry
          # so a simultaneous push cannot fail the job (non-fatal if it still fails).
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main 2>/dev/null; then echo "sync log pushed"; exit 0; fi
            echo "push attempt $attempt collided — rebasing and retrying"
            git fetch origin main --quiet
            git rebase origin/main --autostash 2>/dev/null || git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "sync log push failed after retries (non-fatal)"; exit 0

      - name: Notify sync status
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const status = `${{ job.status }}`;
            const msg = status === 'success' ? '✅ Sync succeeded' : '❌ Sync failed';
            // Notification must never fail the job: wrap in try/catch so a
            // missing issue or missing permissions only logs a warning.
            try {
              const issues = await github.rest.issues.listForRepo({
                owner: context.repo.owner, repo: context.repo.repo, state: 'all', per_page: 1
              });
              if (issues.data.length > 0) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issues.data[0].number,
                  body: `${msg} — workflow: ${{ github.workflow }}, commit: ${{ github.sha }}`
                });
                console.log('Notification posted to issue #' + issues.data[0].number);
              } else {
                console.log('No issue found to notify — skipping (non-fatal).');
              }
            } catch (err) {
              console.log('Notification skipped (non-fatal): ' + err.message);
            }
