name: Deploy Web (Cloudflare Pages)

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "shared/**"
      - "functions/**"
      # `pnpm build` writes the no-JavaScript HTML through these two files, so a
      # change to either changes the deployed site even when no client file
      # moves. Without them a copy or metadata-only edit merges and never ships.
      - "scripts/prerender-public-pages.tsx"
      - "scripts/prerenderSeo.ts"
      - "vite.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

concurrency:
  group: deploy-pages
  cancel-in-progress: false

# ──────────────────────────────────────────────
# EXTENSION POINT: add a new step here for each
# additional target system (Vercel, Netlify, …).
# See scripts/sync-manifest.json for the schema.
# ──────────────────────────────────────────────

permissions:
  contents: write
  issues: write
  # The release gate reads the CI runs of this commit (P1-deploy-green-gate, #748).
  actions: read

jobs:
  # P1-deploy-green-gate (#748): nothing deploys until CI has passed on this exact
  # commit. It waits for CI and refuses on red, cancelled, skipped, missing, still
  # running at the timeout, a GitHub error, or a commit a newer successful deploy
  # has already moved past. Manual recovery: dispatch this workflow on main once
  # main's CI is green (dispatch CI on main first if the tip skipped CI).
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Require green CI on this exact commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/require-green-release.mjs --target web

  deploy:
    needs: release-gate
    runs-on: ubuntu-latest
    steps:
      # Full history: the classifier diffs before..head and the API wait checks ancestry.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # REL-rollback-skew (D-212): does this push change what the API runs?
      - name: Classify the push for API changes
        id: api-changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: bash scripts/classify-api-changes.sh >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm build
        env:
          VITE_WORKOS_CLIENT_ID: client_01M17TTFJ6784B1CN6MHAHB60Y
          VITE_WORKOS_ENABLED: "true"
          VITE_GIT_COMMIT_SHA: ${{ github.sha }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_CLARITY_PROJECT_ID: ${{ secrets.VITE_CLARITY_PROJECT_ID }}

      # REL-rollback-skew (D-212): new client code must not reach an API that is still
      # rolling out (15 to 40 minutes). Wait until /api/health/ready reports this SHA or a
      # descendant. Fail closed: no 200 `state: "ready"` answer within 45 minutes (a
      # timeout, a 5xx, a 401, an HTML body) fails this step, so the Pages deploy below is
      # skipped and the live web keeps the release its API is running.
      - name: Wait for the live API to run this commit
        id: api-wait
        if: steps.api-changes.outputs.classification == 'runtime'
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_API_WAIT_MINUTES: "45"
        run: node scripts/rollbackTarget.mjs wait-api

      # The Deploy failed issue says why. The notify step below records the failed run on it.
      - name: Record that the web was not deployed because the API did not converge
        if: failure() && steps.api-wait.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          msg="API did not converge on ${GITHUB_SHA} within 45 minutes; the web was NOT deployed (REL-rollback-skew). Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "::error::${msg}"
          echo "### ${msg}" >> "$GITHUB_STEP_SUMMARY"
          title="Deploy failed: ${WORKFLOW}"
          gh label create incident --color B60205 >/dev/null 2>&1 || true
          num=$(gh issue list --label incident --state open --limit 100 --json number,title | TITLE="$title" node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const i=JSON.parse(s||"[]").find(x=>x.title===process.env.TITLE);process.stdout.write(i?String(i.number):"")})' || true)
          if [ -n "$num" ]; then gh issue comment "$num" --body "$msg" || true
          else gh issue create --title "$title" --label incident --body "$msg" || true
          fi

      # Last look before the production write: CI may have been re-run red since
      # release-gate passed, or this job alone may be a re-run.
      - name: Re-check green CI before deploying
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/require-green-release.mjs --target web --once

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist/public --project-name skipwait --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify live site carries the pushed commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for i in $(seq 1 10); do
            if curl -s https://skipwait.me/ | grep -q "name=\"git-commit\" content=\"$EXPECTED_SHA\""; then
              echo "SYNC OK: live site carries $EXPECTED_SHA"; exit 0
            fi
            echo "attempt $i: SHA not live yet — waiting"; sleep 15
          done
          echo "SYNC FAILED: live site does not carry the pushed commit"; exit 1

      - name: Append sync log
        if: always()
        run: bash scripts/append-sync-log.sh "${{ github.workflow }}" "${{ github.sha }}" "${{ job.status }}"

      - name: Commit sync log back to main
        if: always()
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@skipwait.me"
          git add docs/SYNC_LOG.md
          if git diff --cached --quiet; then
            echo "no sync log change to commit"
            exit 0
          fi
          git commit -m "Sync log: ${{ github.workflow }} ${{ github.sha }} ${{ job.status }} [skip ci]"
          # The API and Pages workflows push the log concurrently; rebase-retry
          # so a simultaneous push cannot fail the job (non-fatal if it still fails).
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main 2>/dev/null; then echo "sync log pushed"; exit 0; fi
            echo "push attempt $attempt collided — rebasing and retrying"
            git fetch origin main --quiet
            git rebase origin/main --autostash 2>/dev/null || git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "sync log push failed after retries (non-fatal)"; exit 0

      - name: Notify sync status
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            // REL-release-verify (D-212): one "Deploy failed: <workflow>" issue
            // labelled incident, opened or updated on failure and closed on the
            // next success, never a comment on whichever issue is newest.
            // Notification must never fail the job: a missing permission only logs.
            const status = `${{ job.status }}`;
            const title = `Deploy failed: ${{ github.workflow }}`;
            const { owner, repo } = context.repo;
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            try {
              const open = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', labels: 'incident', per_page: 100 });
              const existing = open.find(issue => issue.title === title && !issue.pull_request);
              if (status === 'success') {
                if (existing) {
                  await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body: `Deploy succeeded at ${{ github.sha }}: ${run}` });
                  await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
                  console.log('Closed #' + existing.number);
                }
              } else {
                try {
                  await github.rest.issues.createLabel({ owner, repo, name: 'incident', color: 'B60205' });
                } catch (err) {
                  if (err.status !== 422) throw err;
                }
                const body = `Deploy ${status} — workflow: ${{ github.workflow }}, commit: ${{ github.sha }}, run: ${run}`;
                if (existing) {
                  await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
                  console.log('Updated #' + existing.number);
                } else {
                  const created = await github.rest.issues.create({ owner, repo, title, body, labels: ['incident'] });
                  console.log('Opened #' + created.data.number);
                }
              }
            } catch (err) {
              console.log('Notification skipped (non-fatal): ' + err.message);
            }
