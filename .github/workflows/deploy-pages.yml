name: Deploy Web (Cloudflare Pages)

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "shared/**"
      - "functions/**"
      - "vite.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm build
        env:
          VITE_WORKOS_CLIENT_ID: client_01M18Q4VRZYVY01H3SBSNVFZB2
          VITE_WORKOS_ENABLED: "true"

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist/public --project-name skipwait --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
