name: Reviewer QA passwords - reset Worker secrets (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "type reset to deploy the two protected reviewer password secrets"
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: reviewer-qa-passwords
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    # D-387: the job waits for the reset deploy (about 15 minutes, longer when another deploy is queued) and then starts
    # live QA itself, because a run started with GITHUB_TOKEN creates no workflow_run event for live-qa.yml to follow.
    timeout-minutes: 75
    steps:
      - name: Validate reset confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        shell: bash
        run: |
          if [ "$CONFIRM" != reset ]; then
            echo '::error::Refusing: confirm must equal reset'
            exit 2
          fi

      - name: Dispatch the protected release-time reset
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          echo "since=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          gh workflow run deploy-api.yml --ref main -f reset_reviewer_passwords=true

      - name: Wait for the reset deploy
        id: deploy
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SINCE: ${{ steps.dispatch.outputs.since }}
        shell: bash
        run: |
          # The first manual Deploy API run on main created at or after this job's dispatch is the one it started.
          run_id=""
          for attempt in $(seq 1 30); do
            run_id=$(gh run list --workflow deploy-api.yml --event workflow_dispatch --branch main --limit 20 \
              --json databaseId,createdAt --jq "[.[] | select(.createdAt >= \"$SINCE\")] | sort_by(.createdAt) | .[0].databaseId // empty")
            if [ -n "$run_id" ]; then break; fi
            sleep 10
          done
          if [ -z "$run_id" ]; then
            echo "::error::The reset deploy did not appear within 5 minutes; check Actions > Deploy API before requesting another reset"
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Waiting for Deploy API run $run_id"
          if ! gh run watch "$run_id" --exit-status --interval 30 > /dev/null; then
            echo "::error::The reset deploy (Deploy API run $run_id) did not succeed; live QA was not started. Fix that run, then request the reset again"
            exit 1
          fi

      - name: Start signed-in live QA on the reset release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run live-qa.yml --ref main -f roles=both

      - name: Record reset recovery guidance
        if: ${{ always() }}
        shell: bash
        run: |
          printf '%s\n' \
            '## Reviewer QA password reset requested' \
            '' \
            'The Deploy API workflow validates the reviewer pair from protected repository secrets before production writes.' \
            'Preferred (OPS-reviewer-plaintext-reset, D-373): the owner sets REVIEWER_SEEKER_PASSWORD and REVIEWER_REFERRER_PASSWORD (two different passwords, 16+ characters) on Settings > Secrets and variables > Actions; the release derives both hashes, and the signed-in QA runner reads the same pair.' \
            'Without those two, it uses REVIEWER_SEEKER_PASSWORD_HASH and REVIEWER_REFERRER_PASSWORD_HASH as before. Setting only one plaintext secret is refused.' \
            'Provision the complete pair through the authorized secret channel before requesting a reset.' \
            'This job waits for the dispatched Deploy API run and, only when it succeeds, starts Live QA (signed in) on main (D-387); a green Live QA sign-in for both roles is the proof that the credentials changed.' \
            'If validation fails, correct the protected pair and request the reset again. Never supply credential material in workflow inputs, command arguments, logs or artifacts.' \
            'Record both demo sign-in outcomes on that verified release without publishing credentials.' \
            >> "$GITHUB_STEP_SUMMARY"
