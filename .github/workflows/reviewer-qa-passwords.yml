name: Reviewer QA passwords - reset Worker secrets (manual)

on:
  workflow_dispatch:
    inputs:
      seeker_hash:
        description: "scrypt hash for the reviewer seeker password"
        required: true
        type: string
      referrer_hash:
        description: "scrypt hash for the reviewer referrer password"
        required: true
        type: string
      confirm:
        description: "type reset to update the two reviewer password secrets"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: reviewer-qa-passwords
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate confirmation and password hash format
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { inputs } = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          if (inputs?.confirm !== 'reset') {
            console.error('Refusing: confirm must equal reset');
            process.exit(2);
          }
          for (const field of ['seeker_hash', 'referrer_hash']) {
            const value = inputs[field];
            if (typeof value !== 'string' || !/^scrypt\$[0-9a-fA-F]+\$[0-9a-fA-F]{64}$/.test(value) || /[\r\n]/.test(value)) {
              console.error(`Refusing: ${field} is not a valid scrypt hash`);
              process.exit(3);
            }
          }
          console.log('Inputs accepted; secret values are withheld');
          NODE

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set the two reviewer Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          async function reset() {
            const { inputs } = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
            const worker = fs.readFileSync('wrangler.jsonc', 'utf8').match(/"name":\s*"([a-zA-Z0-9_-]+)"/);
            const token = process.env.CLOUDFLARE_API_TOKEN;
            const account = process.env.CLOUDFLARE_ACCOUNT_ID;
            if (!worker || !token || !account) throw new Error('Missing Worker configuration or Cloudflare credentials');
            const endpoint = `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(account)}/workers/scripts/${encodeURIComponent(worker[1])}/secrets`;
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              '## Reviewer QA password reset\n\nUpdated secrets apply on the next container start; the next deploy applies them to new containers.\n\nIf a later update fails, rerun with the same two hashes to finish the reset.\n\n');
            for (const [name, field] of [
              ['REVIEWER_SEEKER_PASSWORD_HASH', 'seeker_hash'],
              ['REVIEWER_REFERRER_PASSWORD_HASH', 'referrer_hash'],
            ]) {
              let response;
              try {
                response = await fetch(endpoint, {
                  method: 'PUT',
                  headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
                  body: JSON.stringify({ name, text: inputs[field], type: 'secret_text' }),
                  signal: AbortSignal.timeout(30000),
                });
              } catch {
                throw new Error(`Cloudflare request failed for ${name}; reset may be incomplete`);
              }
              if (response.status !== 200) {
                // Cloudflare's error codes and messages carry no secret value; print them so a refusal can be acted on
                // (for example code 10215: the Worker's latest uploaded version is not the deployed one).
                const failure = await response.json().catch(() => null);
                const reasons = Array.isArray(failure?.errors) ? failure.errors.map(e => `${e?.code ?? "?"}: ${String(e?.message ?? "").slice(0, 300)}`).join("; ") : "no error body";
                const route = /10215/.test(reasons)
                  ? ' Route (D-369): dispatch "Deploy API (Cloudflare Containers)" on main with the same two hashes; the release uploads them with the version.'
                  : '';
                throw new Error(`Secret update failed for ${name} (HTTP ${response.status}; ${reasons})${route}`);
              }
              const result = await response.json().catch(() => null);
              if (result?.success !== true) throw new Error(`Cloudflare did not confirm the update for ${name}`);
              console.log(`Updated Worker secret: ${name}`);
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `- Updated \`${name}\`\n`);
            }
          }
          reset().catch(error => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE
